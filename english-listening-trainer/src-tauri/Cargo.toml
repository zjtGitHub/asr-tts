[package]
name = "english-listening-trainer"
version = "0.2.0"
description = "Local-first English listening trainer"
authors = ["English Listening Trainer"]
edition = "2021"

[lib]
name = "english_listening_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
