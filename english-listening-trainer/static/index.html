<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Listening Trainer</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #16181d; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .page { max-width: 980px; margin: 0 auto; padding: 40px 20px 64px; }
    .card { background: #fff; border: 1px solid #e6e9ef; border-radius: 18px; box-shadow: 0 12px 32px rgba(20, 30, 50, .06); }
    .hero { padding: 28px; margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .sub { margin: 0; color: #657080; line-height: 1.6; }
    .upload { margin-top: 22px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    input[type=file] { max-width: 100%; }
    button { border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 650; background: #111827; color: white; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .player-wrap { padding: 20px 24px; position: sticky; top: 12px; z-index: 3; margin-bottom: 20px; }
    audio { width: 100%; }
    .meta { margin-top: 10px; color: #737d8c; font-size: 14px; }
    .transcript { overflow: hidden; }
    .empty { padding: 42px 28px; text-align: center; color: #7c8797; }
    .segment { display: grid; grid-template-columns: 86px 1fr; gap: 12px; padding: 17px 22px; border-top: 1px solid #eef1f5; cursor: pointer; transition: background .15s ease; }
    .segment:first-child { border-top: 0; }
    .segment:hover { background: #f8fafc; }
    .segment.active { background: #eef4ff; }
    .time { font-variant-numeric: tabular-nums; color: #526173; font-size: 13px; padding-top: 4px; }
    .text { font-size: 18px; line-height: 1.6; }
    .status { margin-top: 12px; min-height: 22px; color: #5e6978; }
    .error { color: #b42318; }
    @media (max-width: 640px) { .segment { grid-template-columns: 1fr; } .time { padding-top: 0; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="card hero">
      <h1>English Listening Trainer</h1>
      <p class="sub">Upload an MP3, transcribe English speech locally with Whisper, then click any sentence to jump the audio to that exact moment.</p>
      <div class="upload">
        <input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg" />
        <button id="transcribeBtn" disabled>Transcribe</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section id="playerCard" class="card player-wrap" hidden>
      <audio id="audio" controls preload="metadata"></audio>
      <div id="meta" class="meta"></div>
    </section>

    <section class="card transcript">
      <div id="empty" class="empty">Choose an audio file to begin.</div>
      <div id="segments"></div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const transcribeBtn = document.getElementById('transcribeBtn');
    const statusEl = document.getElementById('status');
    const audio = document.getElementById('audio');
    const playerCard = document.getElementById('playerCard');
    const metaEl = document.getElementById('meta');
    const segmentsEl = document.getElementById('segments');
    const emptyEl = document.getElementById('empty');

    let currentFileUrl = null;
    let segments = [];

    const formatTime = (value) => {
      const total = Math.max(0, Number(value) || 0);
      const minutes = Math.floor(total / 60);
      const seconds = Math.floor(total % 60);
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    };

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status';
    }

    function renderSegments() {
      segmentsEl.innerHTML = '';
      emptyEl.hidden = segments.length > 0;
      segments.forEach((segment, index) => {
        const row = document.createElement('div');
        row.className = 'segment';
        row.dataset.index = index;
        row.innerHTML = `
          <div class="time">${formatTime(segment.start)} → ${formatTime(segment.end)}</div>
          <div class="text"></div>
        `;
        row.querySelector('.text').textContent = segment.text;
        row.addEventListener('click', async () => {
          audio.currentTime = segment.start;
          try { await audio.play(); } catch (_) {}
        });
        segmentsEl.appendChild(row);
      });
    }

    function updateActiveSegment() {
      const current = audio.currentTime;
      let activeIndex = -1;
      for (let i = 0; i < segments.length; i += 1) {
        if (current >= segments[i].start && current < segments[i].end) {
          activeIndex = i;
          break;
        }
      }
      document.querySelectorAll('.segment').forEach((node, index) => {
        node.classList.toggle('active', index === activeIndex);
      });
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files?.[0];
      transcribeBtn.disabled = !file;
      segments = [];
      renderSegments();
      setStatus('');
      if (currentFileUrl) URL.revokeObjectURL(currentFileUrl);
      if (file) {
        currentFileUrl = URL.createObjectURL(file);
        audio.src = currentFileUrl;
        playerCard.hidden = false;
        metaEl.textContent = file.name;
      } else {
        playerCard.hidden = true;
      }
    });

    transcribeBtn.addEventListener('click', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);
      transcribeBtn.disabled = true;
      setStatus('Transcribing… the first run may download the Whisper model.');

      try {
        const response = await fetch('/api/transcribe', { method: 'POST', body: formData });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || 'Transcription failed');

        segments = payload.segments || [];
        renderSegments();
        metaEl.textContent = `${payload.filename} · ${formatTime(payload.duration)} · ${payload.language.toUpperCase()} ${(payload.language_probability * 100).toFixed(1)}%`;
        setStatus(`Done. ${segments.length} timestamped segments generated.`);
      } catch (error) {
        setStatus(error.message || String(error), true);
      } finally {
        transcribeBtn.disabled = false;
      }
    });

    audio.addEventListener('timeupdate', updateActiveSegment);
  </script>
</body>
</html>
